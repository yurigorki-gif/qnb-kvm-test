name: qnb-emulator-capture
on:
  workflow_dispatch:
    inputs:
      run_login:
        description: "Login denemesi (uiautomator)"
        default: "false"
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /home/runner/android-sdk
    steps:
      - uses: actions/checkout@v4

      - name: KVM durumu
        run: |
          ls -la /dev/kvm || echo "KVM YOK"
          sudo apt-get update -q
          sudo apt-get install -y -q cpu-checker adb
          sudo kvm-ok || true

      - name: SDK kurulum
        run: |
          sudo apt-get install -y -q openjdk-17-jdk-headless unzip
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmd.zip
          mkdir -p $ANDROID_HOME/cmdline-tools
          unzip -q /tmp/cmd.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "emulator" "system-images;android-33;google_apis_playstore;x86_64"

      - name: AVD oluştur
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          echo no | avdmanager create avd -n qnb -k "system-images;android-33;google_apis_playstore;x86_64" -d pixel_5 --force
          cat $HOME/.android/avd/qnb.avd/config.ini || true

      - name: APK parçalarını birleştir
        run: |
          mkdir -p apk
          cat apk-parts/* > apk/app.apk
          cat split-parts/* > apk/split.apk
          ls -la apk/

      - name: mitmproxy kur
        run: sudo apt-get install -y -q mitmproxy

      - name: Emulator başlat (sağlam)
        run: |
          export PATH=$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH
          # KVM izin düzelt (runner user kvm grubunda değil!)
          sudo gpasswd -a $USER kvm || true
          sudo chmod 666 /dev/kvm || true
          ls -la /dev/kvm || echo "KVM yok"
          (mitmdump --set block_global=false --set termlog_verbosity=debug -w /tmp/flows.dump > /tmp/mitm.log 2>&1 &)
          sleep 5
          emulator -accel-check || true
          nohup emulator -avd qnb -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect -memory 3072 -no-metrics -no-snapshot \
            -camera-back none -camera-front none \
            -writable-system > /tmp/emu.log 2>&1 &
          sleep 30
          echo "=== emu.log (ilk 40 satır) ==="
          head -40 /tmp/emu.log || true
          echo "=== adb devices ==="
          timeout 20 adb devices || true
          timeout 300 adb wait-for-device || echo "wait-for-device TIMEOUT"
          for i in $(seq 1 30); do
            B=$(timeout 15 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            echo "boot check $i: $B"
            [ "$B" = "1" ] && break
            sleep 10
          done
          timeout 30 adb root || true
          sleep 3
          timeout 60 adb remount || true
          sleep 3
          echo "=== emu.log (son 30) ==="
          tail -30 /tmp/emu.log || true
          adb devices || true

      - name: System CA + proxy ayarla
        run: |
          export PATH=$ANDROID_HOME/platform-tools:$PATH
          CA=/home/runner/.mitmproxy/mitmproxy-ca-cert.pem
          for i in $(seq 1 20); do [ -f $CA ] && break; sleep 3; done
          HASH=$(openssl x509 -subject_hash_old -in $CA -noout)
          adb push $CA /sdcard/$HASH.0
          adb shell "mount -o rw,remount / || mount -o rw,remount /system" || true
          adb shell "cp /sdcard/$HASH.0 /system/etc/security/cacerts/$HASH.0 && chmod 644 /system/etc/security/cacerts/$HASH.0" || true
          adb shell "settings put global http_proxy 10.0.2.2:8080" || true
          adb shell getprop ro.product.cpu.abilist || true

      - name: APK yükle + uygulamayı başlat
        run: |
          export PATH=$ANDROID_HOME/platform-tools:$PATH
          timeout 400 adb install-multiple -r apk/app.apk apk/split.apk || echo "INSTALL FAIL"
          sleep 5
          adb shell pm list packages | grep -i finans || true
          adb shell monkey -p com.finansbank.mobile.cepsube -c android.intent.category.LAUNCHER 1 || true
          sleep 90
          adb exec-out screencap -p > screen1.png || true
          sleep 60
          adb exec-out screencap -p > screen2.png || true
          adb logcat -d > logcat.txt || true
          cp /tmp/mitm.log mitm.log || true
          cp /tmp/emu.log emu.log || true
          cp /tmp/flows.dump flows.dump 2>/dev/null || true

      - name: Login denemesi (opsiyonel)
        if: ${{ github.event.inputs.run_login == 'true' }}
        run: |
          export PATH=$ANDROID_HOME/platform-tools:$PATH
          adb shell uiautomator dump /sdcard/ui.xml || true
          adb pull /sdcard/ui.xml ui.xml || true
          sleep 120
          adb exec-out screencap -p > screen3.png || true
          adb logcat -d > logcat2.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture
          path: |
            mitm.log
            emu.log
            logcat.txt
            logcat2.txt
            screen*.png
            ui.xml
            flows.dump
          if-no-files-found: ignore

      - name: emu.log'u çıktıya yaz
        if: always()
        run: tail -50 /tmp/emu.log || true
