name: qnb-emulator-capture
on:
  workflow_dispatch:
    inputs:
      run_login:
        description: "Login denemesi yap (uiautomator ile)"
        default: "false"
jobs:
  emulator:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      ANDROID_HOME: /home/runner/android-sdk
    steps:
      - uses: actions/checkout@v4

      - name: KVM check
        run: |
          ls -la /dev/kvm || true
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-kvm cpu-checker
          sudo kvm-ok || true
          sudo chmod 666 /dev/kvm || true

      - name: SDK kurulum (debug)
        run: |
          set -x
          sudo apt-get install -y -q openjdk-17-jdk-headless unzip
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmd.zip
          mkdir -p $ANDROID_HOME/cmdline-tools
          unzip -q /tmp/cmd.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          java -version
          echo JAVA_HOME=$JAVA_HOME
          yes | sdkmanager --licenses || true
          echo "--- try normal ---"
          sdkmanager --install "platform-tools" "emulator" "system-images;android-33;google_apis;arm64-v8a" || true
          echo "--- try no_https ---"
          sdkmanager --no_https --install "platform-tools" "emulator" "system-images;android-33;google_apis;arm64-v8a" || true
          ls $ANDROID_HOME
          [ -x $ANDROID_HOME/emulator/emulator ] && echo EMU_OK || echo EMU_MISSING

      - name: AVD oluştur
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH
          echo no | avdmanager create avd -n qnb -k "system-images;android-33;google_apis;arm64-v8a" -d pixel_5 --force

      - name: APK parçalarını birleştir
        run: |
          mkdir -p apk
          cat apk-parts/* > apk/app.apk
          cat split-parts/* > apk/split.apk
          ls -la apk/

      - name: mitmproxy kur
        run: sudo apt-get install -y -q mitmproxy

      - name: Emulator başlat
        run: |
          export PATH=$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH
          mkdir -p /home/runner/.mitmproxy
          (mitmdump --set block_global=false --set termlog_verbosity=debug -w /tmp/flows.dump > /tmp/mitm.log 2>&1 &)
          sleep 5
          nohup emulator -avd qnb -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect -memory 3072 -no-metrics \
            -writable-system > /tmp/emu.log 2>&1 &
          adb wait-for-device
          for i in $(seq 1 60); do
            B=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            echo "boot check $i: $B"
            [ "$B" = "1" ] && break
            sleep 10
          done
          adb root
          sleep 3
          adb remount || true
          sleep 3

      - name: System CA + proxy ayarla
        run: |
          export PATH=$ANDROID_HOME/platform-tools:$PATH
          CA=/home/runner/.mitmproxy/mitmproxy-ca-cert.pem
          for i in $(seq 1 20); do [ -f $CA ] && break; sleep 3; done
          HASH=$(openssl x509 -subject_hash_old -in $CA -noout)
          adb push $CA /sdcard/$HASH.0
          adb shell "mount -o rw,remount / || mount -o rw,remount /system"
          adb shell "cp /sdcard/$HASH.0 /system/etc/security/cacerts/$HASH.0 && chmod 644 /system/etc/security/cacerts/$HASH.0"
          adb shell "settings put global http_proxy 10.0.2.2:8080"

      - name: APK yükle + uygulamayı başlat
        run: |
          export PATH=$ANDROID_HOME/platform-tools:$PATH
          adb install-multiple -r apk/app.apk apk/split.apk || true
          sleep 5
          adb shell pm list packages | grep -i finans || true
          adb shell monkey -p com.finansbank.mobile.cepsube -c android.intent.category.LAUNCHER 1 || true
          sleep 90
          adb exec-out screencap -p > screen1.png || true
          sleep 60
          adb exec-out screencap -p > screen2.png || true
          adb logcat -d > logcat.txt || true
          cp /tmp/mitm.log mitm.log || true
          cp /tmp/emu.log emu.log || true
          cp /tmp/flows.dump flows.dump 2>/dev/null || true

      - name: Login denemesi (opsiyonel)
        if: ${{ github.event.inputs.run_login == 'true' }}
        run: |
          export PATH=$ANDROID_HOME/platform-tools:$PATH
          adb shell uiautomator dump /sdcard/ui.xml || true
          adb pull /sdcard/ui.xml ui.xml || true
          sleep 120
          adb exec-out screencap -p > screen3.png || true
          adb logcat -d > logcat2.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture
          path: |
            mitm.log
            emu.log
            logcat.txt
            logcat2.txt
            screen*.png
            ui.xml
            flows.dump
          if-no-files-found: ignore
